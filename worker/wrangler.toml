name = "serie-a-scout-ai"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origini autorizzate a chiamare il Worker. Lista vuota = tutti (solo in locale).
ALLOWED_ORIGINS = "https://raffaeleciccone-analyst.github.io"

# Il Worker scarica lui il dataset, cosi' il prompt e' identico a ogni richiesta
# e il prompt caching funziona. Rigenera con build_ai_dataset.py e ripusha.
DATASET_URL = "https://raffaeleciccone-analyst.github.io/serie-a-index/ai_dataset.json"

# Modello. Il lavoro qui e' leggere una tabella e citarne i numeri senza
# inventarli: sonnet-5 lo fa bene a circa meta' del costo di opus-5, che resta
# l'upgrade se lo vedi sbagliare i confronti fra giocatori. haiku-4-5 costa
# ancora meno ma e' il piu' esposto al fallire "in bello": risposta scorrevole
# con il numero sbagliato, che su una demo di rigore statistico e' il peggior
# tipo di errore. Il codice adatta i parametri al modello, quindi cambiare questa
# riga e basta.
MODEL = "claude-sonnet-5"

# Profondita di ragionamento: low | medium | high | xhigh | max.
# "medium" e' il compromesso giusto per una chat; alza a "high" se le risposte
# analitiche ti sembrano superficiali. Ignorato su haiku, che non lo supporta.
EFFORT = "medium"

# Tetto giornaliero globale di richieste. Attivo solo se esiste il binding KV
# QUOTA qui sotto. E' questo che protegge il credito, non il rate limit per IP.
DAILY_LIMIT = "300"

# --- BACKEND ALTERNATIVO (formato OpenAI) ------------------------------------
# Valorizzando COMPAT_API_URL il Worker smette di usare l'API Anthropic e parla
# `POST /chat/completions`. Non e' legato a un fornitore: lo parlano OpenAI,
# Mistral, Groq, DeepSeek, Together, OpenRouter, xAI, l'endpoint compatibile di
# Gemini, e in locale Ollama e LM Studio.
#
# Resta COMMENTATO: se finisce in `wrangler deploy` il Worker pubblico chiama
# quell'indirizzo invece di quello configurato sopra. Per una prova passalo da
# riga di comando, cosi' non c'e' niente da ricordarsi di rimettere a posto:
#
#   npx wrangler dev \
#     --var COMPAT_API_URL:https://api.mistral.ai/v1 \
#     --var COMPAT_MODEL:mistral-large-latest \
#     --var COMPAT_API_KEY:...
#
# COMPAT_API_URL   endpoint, senza /chat/completions in fondo
# COMPAT_MODEL     nome del modello
# COMPAT_API_KEY   inviata come `Authorization: Bearer`. Omettila in locale.
#                  Su un fornitore vero usa `wrangler secret put`, non questo file.
# COMPAT_MAX_TOKENS   tetto di output (default: come il percorso Anthropic)
# COMPAT_TOKEN_PARAM  "max_tokens" (default) oppure "max_completion_tokens", che
#                  e' quello che vogliono i modelli di ragionamento OpenAI recenti
# COMPAT_MAX_PLAYERS  riduce il dataset ai primi N giocatori. SPENTO di default.
#                  Serve solo con modelli a contesto piccolo: con un fornitore
#                  cloud lascialo spento, o l'assistente rispondera' "non e' nel
#                  dataset" su giocatori che invece ci sono.
#
# Per il tuo Ollama (num_ctx=4096) i valori misurati sono questi:
#   --var COMPAT_API_URL:http://localhost:11434/v1 --var COMPAT_MODEL:qwen3:14b \
#   --var COMPAT_MAX_PLAYERS:10 --var COMPAT_MAX_TOKENS:700

# Rate limit per IP: 8 richieste ogni 60 secondi.
# period accetta solo 10 o 60.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Contatore giornaliero. Facoltativo: crea il namespace con
#   npx wrangler kv namespace create QUOTA
# e incolla l'id qui sotto, poi togli il commento.
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "<incolla-qui-l-id>"
