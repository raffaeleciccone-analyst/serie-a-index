name = "serie-a-scout-ai"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origini autorizzate a chiamare il Worker. Lista vuota = tutti (solo in locale).
ALLOWED_ORIGINS = "https://raffaeleciccone-analyst.github.io"

# Il Worker scarica lui il dataset, cosi' il prompt e' identico a ogni richiesta
# e il prompt caching funziona. Rigenera con build_ai_dataset.py e ripusha.
DATASET_URL = "https://raffaeleciccone-analyst.github.io/serie-a-scout-demo/ai_dataset.json"

# Modello. claude-opus-5 e' il default; per abbattere il costo di una demo ad
# alto traffico puoi passare a claude-sonnet-5 o claude-haiku-4-5.
MODEL = "claude-opus-5"

# Profondita di ragionamento: low | medium | high | xhigh | max.
# "medium" e' il compromesso giusto per una chat; alza a "high" se le risposte
# analitiche ti sembrano superficiali.
EFFORT = "medium"

# Tetto giornaliero globale di richieste. Attivo solo se esiste il binding KV
# QUOTA qui sotto. E' questo che protegge il credito, non il rate limit per IP.
DAILY_LIMIT = "300"

# --- SOLO SVILUPPO: modello locale (Ollama, LM Studio) -----------------------
# Togli il commento a LOCAL_MODEL_URL e il Worker chiama la tua IA locale invece
# dell'API remota, a costo zero. Funziona solo con `wrangler dev`: un Worker
# distribuito sull'edge non raggiunge il tuo localhost.
#
# Ollama:     http://localhost:11434/v1   (modello: es. "llama3.1")
# LM Studio:  http://localhost:1234/v1    (nome del modello caricato)
#
# LASCIALO COMMENTATO PRIMA DI `wrangler deploy`, altrimenti il Worker pubblico
# prova a chiamare un indirizzo che non esiste e ogni risposta e' un errore.
# LOCAL_MODEL_URL = "http://localhost:11434/v1"
# LOCAL_MODEL = "llama3.1"
# Quanti giocatori tenere nel dataset in modalita' locale (default 25). Il
# dataset intero e' ~20k token: con la finestra di contesto di un modello locale
# verrebbe troncato in silenzio e le risposte sarebbero inventate.
# LOCAL_MAX_PLAYERS = "25"

# Rate limit per IP: 8 richieste ogni 60 secondi.
# period accetta solo 10 o 60.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Contatore giornaliero. Facoltativo: crea il namespace con
#   npx wrangler kv namespace create QUOTA
# e incolla l'id qui sotto, poi togli il commento.
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "<incolla-qui-l-id>"
