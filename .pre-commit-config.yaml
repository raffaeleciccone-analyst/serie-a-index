# Pre-commit hooks — installa una volta con:  pre-commit install
# Esegui manualmente su tutti i file:           pre-commit run --all-files
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: detect-private-key

  # Il dataset dell'assistente si genera da payload.json: se lo committi
  # vecchio, l'assistente risponde con i numeri della settimana scorsa e
  # nessuno se ne accorge (e' successo: era indietro di otto giorni).
  - repo: local
    hooks:
      - id: ai-dataset-allineato
        name: ai_dataset.json allineato a payload.json
        entry: python controlla_ai_dataset.py
        language: system
        pass_filenames: false
        files: '^(payload\.json|ai_dataset\.json|controlla_ai_dataset\.py|validazione_sintesi\.json)$'
